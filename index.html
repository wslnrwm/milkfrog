<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>奶蛙快跑</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #1d2b23;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  #game {
    border-radius: 14px;
    box-shadow: 0 18px 60px rgba(0,0,0,.55);
    touch-action: manipulation;
    cursor: pointer;
  }
  #muteBtn {
    position: fixed; right: 14px; top: 14px;
    background: rgba(255,255,255,.85);
    border: none; border-radius: 20px;
    padding: 7px 16px; font-size: 14px;
    font-family: inherit;
    cursor: pointer; z-index: 10;
    box-shadow: 0 3px 10px rgba(0,0,0,.25);
  }
  #muteBtn:hover { background: #fff; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="muteBtn">音效：开</button>
<script>
(() => {
"use strict";

/* ================= 基础设置 ================= */
const W = 960, H = 540, GROUND = 462;
const GRAVITY = 2900;
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const muteBtn = document.getElementById("muteBtn");

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const scale = Math.min(innerWidth / W, innerHeight / H) * 0.97;
  canvas.style.width = W * scale + "px";
  canvas.style.height = H * scale + "px";
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
addEventListener("resize", resize);

/* ================= 音效（WebAudio 合成，无外部文件） ================= */
let audioCtx = null, muted = false;
function beep(freqA, freqB, dur, type, vol) {
  if (muted) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(freqA, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(freqB, 1), t + dur);
    g.gain.setValueAtTime(vol || 0.12, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  } catch (e) { /* 忽略音频错误 */ }
}
const sfx = {
  jump:  () => beep(420, 640, 0.12, "square", 0.10),
  jump2: () => beep(520, 820, 0.12, "square", 0.10),
  eat:   () => beep(880, 1400, 0.09, "sine", 0.14),
  gold:  () => { beep(880, 1760, 0.12, "sine", 0.14); setTimeout(() => beep(1320, 2200, 0.14, "sine", 0.12), 90); },
  hit:   () => beep(220, 55, 0.35, "sawtooth", 0.16),
  milestone: () => beep(660, 990, 0.15, "triangle", 0.12),
  shield:  () => { beep(520, 1040, 0.18, "sine", 0.13); setTimeout(() => beep(780, 1560, 0.16, "sine", 0.10), 80); },
  magnet:  () => beep(280, 880, 0.22, "triangle", 0.12),
  combo:   () => beep(990, 1660, 0.08, "sine", 0.11),
  splash:  () => beep(200, 70, 0.22, "sine", 0.13),
  crack:   () => beep(150, 55, 0.16, "square", 0.14),
};
muteBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  muted = !muted;
  muteBtn.textContent = muted ? "音效：关" : "音效：开";
});

/* ================= 游戏状态 ================= */
const S_START = 0, S_PLAY = 1, S_OVER = 2;
let state = S_START;
let paused = false;
let elapsed = 0;          // 总时长（昼夜循环用）
let dist = 0;             // 奔跑距离
let speed = 350;
let coinScore = 0;        // 金币得分
let coinsGot = 0;         // 本局捡到的金币数
let best = +(localStorage.getItem("milkfrog-best") || 0);
let shakeT = 0;           // 撞击震屏
let overT = 0;            // 结束后计时（延迟允许重开）

const frog = {
  x: 130, y: GROUND, vy: 0,
  w: 64, h: 88,
  jumps: 0, maxJumps: 2,
  runT: 0, blink: 0, blinkNext: 2,
  deadRot: 0,
};

let obstacles = [];   // 障碍
let coins = [];       // 可收集的金币

/* 豆包生成的奶蛙精灵图（extract_sprites.py 从 ark-gen.jpeg 抠出） */
const sprites = {
  run: new Image(),    // 侧面奔跑
  stand: new Image(),  // 正面站立（菜单展示）
};
sprites.run.src = "naewa-run.png";
sprites.stand.src = "naewa-stand.png";
let parts = [];       // 粒子
let popups = [];      // 飘字
let clouds = [];
let spawnT = 1.4, coinT = 2.0;
let nextMilestone = 100;

/* ---- 拓展玩法：道具 / 连击 / 主题 / 天气 ---- */
let items = [];                // 道具（护盾/磁铁）
let combo = 0, comboT = 0;     // 连击数 / 连击倒计时（2秒内吃金币续上）
let shieldT = 0, magnetT = 0;  // 增益剩余秒数
let slowT = 0;                 // 踩水坑减速剩余秒数
let itemT = 6.0;               // 道具生成计时
let themeIdx = 0, themeFrom = 0, themeK = 1;  // 主题切换（草地→池塘→夜晚）
let weather = 0, weatherT = 30;               // 天气：0晴 1雨 2风
let drops = [];                // 天气粒子（雨滴/落叶）

/* 初始云 */
for (let i = 0; i < 5; i++) clouds.push(makeCloud(Math.random() * W));

function makeCloud(x) {
  return {
    x, y: 60 + Math.random() * 160,
    s: 0.6 + Math.random() * 0.9,
    v: 12 + Math.random() * 20,
  };
}

/* ================= 输入 ================= */
function doJump() {
  if (state === S_START) { startGame(); return; }
  if (state === S_OVER) { if (overT > 0.6) restart(); return; }
  if (paused) return;
  if (frog.jumps < frog.maxJumps) {
    frog.vy = frog.jumps === 0 ? -905 : -790;
    frog.jumps++;
    frog.jumps === 1 ? sfx.jump() : sfx.jump2();
    if (frog.jumps === 2) puff(frog.x + 20, frog.y - 6, "#ffffff", 6);
  }
}

function startGame() {
  state = S_PLAY;
  dist = 0; coinScore = 0; coinsGot = 0; speed = 350;
  obstacles = []; coins = []; parts = []; popups = [];
  frog.y = GROUND; frog.vy = 0; frog.jumps = 0; frog.deadRot = 0;
  spawnT = 1.5; coinT = 2.2; nextMilestone = 100;
  items = []; combo = 0; comboT = 0; shieldT = 0; magnetT = 0; slowT = 0; itemT = 6;
  themeIdx = 0; themeFrom = 0; themeK = 1;
  weather = 0; weatherT = rand(25, 40); drops = [];
  sfx.jump();
}
function restart() { startGame(); }

addEventListener("keydown", (e) => {
  if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
    e.preventDefault();
    doJump();
  } else if (e.code === "KeyP" && state === S_PLAY) {
    paused = !paused;
  }
});
canvas.addEventListener("mousedown", (e) => { e.preventDefault(); doJump(); });
canvas.addEventListener("touchstart", (e) => { e.preventDefault(); doJump(); }, { passive: false });
addEventListener("blur", () => { if (state === S_PLAY) paused = true; });

/* ================= 工具 ================= */
const rand = (a, b) => a + Math.random() * (b - a);
function overlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}
function frogBox() {
  return { x: frog.x + 12, y: frog.y - frog.h + 8, w: frog.w - 26, h: frog.h - 12 };
}
function puff(x, y, color, n) {
  for (let i = 0; i < n; i++)
    parts.push({ x, y, vx: rand(-70, 70), vy: rand(-120, -20), r: rand(2, 5), life: rand(.3, .6), t: 0, color });
}
function sparkle(x, y) {
  for (let i = 0; i < 8; i++) {
    const a = Math.random() * Math.PI * 2, v = rand(40, 140);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: rand(1.5, 3.5), life: .45, t: 0, color: "#ffe37a" });
  }
}
function popup(x, y, text, color) { popups.push({ x, y, text, color, t: 0 }); }

/* ================= 生成障碍与金币 ================= */
function spawnObstacle() {
  const roll = Math.random();
  const hasFlyer = obstacles.some(o => o.type === "bee" || o.type === "bird");
  let o;
  if (score() > 15 && roll < 0.11 && !hasFlyer) {
    // 蜜蜂：悬在头部高度，必须贴地跑
    o = { type: "bee", x: W + 60, y: GROUND - 118, w: 46, h: 36, wingT: 0 };
  } else if (score() > 60 && roll < 0.23 && !hasFlyer) {
    // 飞鸟：低档需跳过，高档需贴地跑（与蜜蜂不同屏出现）
    const high = Math.random() < 0.45;
    const by = GROUND - (high ? 132 : 58);
    o = { type: "bird", x: W + 60, y: by, baseY: by, w: 52, h: 42, wingT: rand(0, 6) };
  } else if (score() > 30 && roll < 0.35) {
    // 水坑：踩中不死，但减速并清空连击
    o = { type: "puddle", x: W + 60, y: GROUND, w: rand(74, 112), h: 12, rip: rand(0, 1), hit: false };
  } else if (roll < 0.55) {
    o = { type: "rock", x: W + 60, y: GROUND, w: 44, h: 34 };
  } else if (roll < 0.71) {
    o = { type: "rock2", x: W + 60, y: GROUND, w: 46, h: 58 };
  } else if (roll < 0.87) {
    o = { type: "stump", x: W + 60, y: GROUND, w: 58, h: 66 };
  } else {
    o = { type: "bush", x: W + 60, y: GROUND, w: 76, h: 44 };
  }
  obstacles.push(o);
}

/* ---- 道具生成：护盾 / 磁铁 ---- */
function spawnItem() {
  const kind = Math.random() < 0.5 ? "shield" : "magnet";
  items.push({ kind, x: W + 60, y: GROUND - rand(85, 190), t: rand(0, 6) });
}
function spawnCoins() {
  const n = 3 + Math.floor(Math.random() * 3); // 3~5 枚
  const high = Math.random() < 0.4;             // 高空一排需要二段跳
  const y = GROUND - (high ? rand(150, 195) : rand(80, 120));
  const gold = Math.random() < 0.12;            // 稀有大金币
  const startX = W + 60 + rand(0, 120);
  for (let i = 0; i < n; i++)
    coins.push({ x: startX + i * 48, y: y + Math.sin(i) * 10, r: 11, gold, t: Math.random() * 6 });
}

/* ================= 更新 ================= */
function score() { return Math.floor(dist / 12) + coinScore; }

function update(dt) {
  if (state === S_PLAY && paused) return;
  elapsed += dt;
  frog.blinkNext -= dt;
  if (frog.blinkNext <= 0) { frog.blink = 0.12; frog.blinkNext = rand(1.8, 4.5); }
  if (frog.blink > 0) frog.blink -= dt;

  // 云（起风时加速飘动）
  const windK = weather === 2 ? 1.9 : 1;
  for (const c of clouds) {
    c.x -= (c.v * windK + speed * 0.06) * dt;
    if (c.x < -120) Object.assign(c, makeCloud(W + 120));
  }

  // 天气系统（晴/雨/风，纯视觉不影响操作）
  weatherT -= dt;
  if (weatherT <= 0) {
    weather = (weather + 1 + Math.floor(Math.random() * 2)) % 3;
    weatherT = rand(25, 40);
    drops = [];
    popup(W / 2, 128, weather === 1 ? "下雨了" : weather === 2 ? "起风了" : "雨过天晴",
      weather === 1 ? "#9fd4f0" : weather === 2 ? "#d6e8a8" : "#ffe9a0");
  }
  if (weather === 1) {
    while (drops.length < 90)
      drops.push({ x: rand(-40, W + 80), y: rand(-60, -6), v: rand(540, 780), vx: -speed * 0.32, len: rand(9, 17) });
  } else if (weather === 2) {
    while (drops.length < 14)
      drops.push({ leaf: true, x: W + 20, y: rand(70, GROUND - 90), vx: -(150 + speed * 0.55), vy: rand(16, 52), rot: rand(0, 6.3), rotV: rand(-4, 4), s: rand(0.7, 1.35), wob: rand(0, 6.3) });
  }
  for (const d of drops) {
    if (d.leaf) {
      d.wob += dt * 3;
      d.x += d.vx * dt;
      d.y += (d.vy + Math.sin(d.wob) * 26) * dt;
      d.rot += d.rotV * dt;
    } else {
      d.x += d.vx * dt;
      d.y += d.v * dt;
    }
  }
  if (weather === 1) drops = drops.filter(d => d.y < GROUND + 6);
  else if (weather === 2) drops = drops.filter(d => d.x > -40 && d.y < GROUND + 10);
  else drops = [];

  // 主题过渡渐变
  if (themeK < 1) themeK = Math.min(1, themeK + dt / 1.8);

  // 粒子 / 飘字
  for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; }
  parts = parts.filter(p => p.t < p.life);
  for (const p of popups) { p.t += dt; p.y -= 40 * dt; }
  popups = popups.filter(p => p.t < 0.9);

  if (shakeT > 0) shakeT -= dt;

  if (state !== S_PLAY) {
    if (state === S_OVER) {
      overT += dt;
      // 参照视频结尾：向前扑倒趴地
      frog.deadRot = Math.min(frog.deadRot + dt * 4, 1.5);
    }
    return;
  }

  // 速度与距离（踩水坑临时减速）
  speed = Math.min(350 + dist * 0.014, 780);
  const spd = speed * (slowT > 0 ? 0.7 : 1);
  if (slowT > 0) slowT -= dt;
  dist += spd * dt;
  const sc = score();
  if (sc >= nextMilestone) {
    nextMilestone += 100;
    sfx.milestone();
  }

  // 主题切换：草地(0-400)→池塘(400-800)→夜晚(800+)循环
  const ti = Math.floor(sc / 400) % 3;
  if (ti !== themeIdx) {
    themeFrom = themeIdx; themeIdx = ti; themeK = 0;
    popup(W / 2, 168, "—— " + THEMES[ti].name + " ——", "#ffffff");
    sfx.milestone();
  }

  // 连击倒计时
  if (comboT > 0) { comboT -= dt; if (comboT <= 0) { comboT = 0; combo = 0; } }
  // 增益倒计时
  if (shieldT > 0) shieldT -= dt;
  if (magnetT > 0) magnetT -= dt;

  // 蛙物理
  frog.vy += GRAVITY * dt;
  frog.y += frog.vy * dt;
  if (frog.y >= GROUND) {
    if (!frog.onGround && frog.vy > 300) puff(frog.x + 22, GROUND, "#c9bfa4", 7);
    frog.y = GROUND; frog.vy = 0;
    frog.jumps = 0; frog.onGround = true;
  } else frog.onGround = false;
  frog.runT += dt * (frog.onGround ? spd * 0.05 : 2.2);

  // 生成（间距随速度微缩，但保证可跳过）
  spawnT -= dt;
  if (spawnT <= 0) { spawnObstacle(); spawnT = rand(0.95, 1.6) * Math.pow(350 / speed, 0.4); }
  coinT -= dt;
  if (coinT <= 0) { spawnCoins(); coinT = rand(2.6, 4.6); }

  // 障碍移动与碰撞
  const fb = frogBox();
  for (const o of obstacles) {
    o.x -= (o.type === "bird" ? spd + 90 : spd) * dt;
    if (o.type === "bee") {
      o.wingT += dt * 30;
      o.y = GROUND - 118 + Math.sin(elapsed * 5 + o.x * 0.01) * 7;
    } else if (o.type === "bird") {
      o.wingT += dt * 16;
      o.y = o.baseY + Math.sin(elapsed * 4 + o.x * 0.008) * 7;
    } else if (o.type === "puddle") {
      o.rip += dt;
      // 水坑：踩中不死，但溅水减速 + 清空连击
      if (!o.hit && frog.y > GROUND - 10 && overlap(fb.x, fb.y, fb.w, fb.h, o.x + 6, GROUND - 12, o.w - 12, 16)) {
        o.hit = true;
        slowT = 2.0;
        if (combo >= 2) popup(frog.x + 32, frog.y - 108, "连击中断", "#9fb7c8");
        combo = 0; comboT = 0;
        sfx.splash();
        for (let i = 0; i < 12; i++)
          parts.push({ x: rand(o.x, o.x + o.w), y: GROUND - 4, vx: rand(-90, 90), vy: rand(-260, -90), r: rand(2, 4.5), life: rand(.3, .55), t: 0, color: "#8fd0f2" });
      }
      continue;
    }
    if (overlap(fb.x, fb.y, fb.w, fb.h, o.x + 6, o.y - o.h + 4, o.w - 12, o.h - 6)) {
      if (shieldT > 0) {
        // 护盾抵挡：障碍碎裂，不结束游戏
        shieldT = 0;
        o.dead = true;
        shakeT = 0.2;
        sfx.crack();
        puff(o.x + o.w / 2, o.y - o.h / 2, "#bfe3ff", 18);
        puff(o.x + o.w / 2, o.y - o.h / 2, "#ffffff", 10);
        popup(frog.x + 32, frog.y - 108, "护盾抵挡！", "#8fd0ff");
      } else {
        die();
        return;
      }
    }
  }
  obstacles = obstacles.filter(o => !o.dead && o.x + o.w > -40);

  // 道具移动与拾取
  for (const it of items) {
    it.x -= spd * dt; it.t += dt;
    const iy = it.y + Math.sin(it.t * 3) * 6;
    if (overlap(fb.x - 10, fb.y - 10, fb.w + 20, fb.h + 20, it.x - 22, iy - 22, 44, 44)) {
      it.got = true;
      sparkle(it.x, iy);
      if (it.kind === "shield") { shieldT = 8; popup(it.x, iy - 26, "护盾！", "#8fd0ff"); sfx.shield(); }
      else { magnetT = 8; popup(it.x, iy - 26, "磁铁！", "#ff9d9d"); sfx.magnet(); }
    }
  }
  items = items.filter(it => !it.got && it.x > -40);

  // 捡金币（磁铁吸附 + 连击加成）
  const fcx = frog.x + frog.w / 2, fcy = frog.y - frog.h / 2;
  for (const c of coins) {
    c.t += dt;
    if (magnetT > 0) {
      const d = Math.max(Math.hypot(fcx - c.x, fcy - c.y), 0.001);
      if (d < 300) {
        const pull = (560 + speed) * dt;
        c.x += ((fcx - c.x) / d) * pull;
        c.y += ((fcy - c.y) / d) * pull;
      }
    }
    c.x -= spd * dt;
    const cy = c.y + Math.sin(c.t * 4) * 5;
    if (overlap(fb.x - 14, fb.y - 14, fb.w + 28, fb.h + 28, c.x - c.r, cy - c.r, c.r * 2, c.r * 2)) {
      c.got = true;
      combo = comboT > 0 ? combo + 1 : 1;
      comboT = 2.0;
      const mult = combo >= 5 ? 2 : 1;
      const gain = (c.gold ? 50 : 10) * mult;
      coinScore += gain;
      coinsGot++;
      c.gold ? sfx.gold() : sfx.eat();
      if (mult > 1) sfx.combo();
      sparkle(c.x, cy);
      popup(c.x, cy - 16, "+" + gain, mult > 1 ? "#ff8b2e" : (c.gold ? "#f59e0b" : "#e0a10a"));
      if (combo >= 3) popup(c.x, cy - 40, "连击 x" + combo, "#7ee081");
    }
  }
  coins = coins.filter(c => !c.got && c.x > -30);
}

function die() {
  state = S_OVER;
  overT = 0;
  shakeT = 0.35;
  sfx.hit();
  puff(frog.x + 30, frog.y - 30, "#e8e2d0", 14);
  const sc = score();
  if (sc > best) {
    best = sc;
    localStorage.setItem("milkfrog-best", best);
  }
}

/* ================= 绘制 ================= */
/* ---- 主题关键帧：草地 → 池塘 → 夜晚（按分数循环切换） ---- */
const THEMES = [
  { name: "草地", top: "#7ec8f0", bot: "#cfeef7", night: 0, pond: 0,
    hill: "#5f8f5a", ground: "#8a6b4a", groundDark: "#7a5c3e", grass: "#6fae4e", grass2: "#7ec25a" },
  { name: "池塘", top: "#8fd8ea", bot: "#dcf6ef", night: 0, pond: 1,
    hill: "#4f9a86", ground: "#7d6b4f", groundDark: "#6b5a42", grass: "#57ab7c", grass2: "#6fbf8c" },
  { name: "夜晚", top: "#131a33", bot: "#2c3358", night: 1, pond: 0,
    hill: "#1e2c28", ground: "#54463a", groundDark: "#463a30", grass: "#3e7d46", grass2: "#4b9050" },
];
function lerp(a, b, k) { return a + (b - a) * k; }
function lerpColor(c1, c2, k) {
  const p = (c, i) => parseInt(c.substr(i, 2), 16);
  return `rgb(${Math.round(lerp(p(c1,1),p(c2,1),k))},${Math.round(lerp(p(c1,3),p(c2,3),k))},${Math.round(lerp(p(c1,5),p(c2,5),k))})`;
}
// 当前混合后的主题状态（含切换过渡渐变）
function skyState() {
  const A = THEMES[themeFrom], B = THEMES[themeIdx], k = themeK;
  const mix = (p, q) => lerpColor(p, q, k);
  return {
    top: mix(A.top, B.top), bot: mix(A.bot, B.bot),
    hill: mix(A.hill, B.hill),
    ground: mix(A.ground, B.ground), groundDark: mix(A.groundDark, B.groundDark),
    grass: mix(A.grass, B.grass), grass2: mix(A.grass2, B.grass2),
    night: lerp(A.night, B.night, k), pond: lerp(A.pond, B.pond, k),
  };
}

function drawBackground(sky) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, sky.top);
  g.addColorStop(1, sky.bot);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 星星（夜晚）
  if (sky.night > 0.05) {
    ctx.globalAlpha = sky.night;
    for (let i = 0; i < 40; i++) {
      const sx = (i * 137.5) % W, sy = (i * 89.7) % 300;
      const tw = 0.5 + 0.5 * Math.sin(elapsed * 2 + i);
      ctx.fillStyle = "rgba(255,255,255," + (0.3 + tw * 0.6) + ")";
      ctx.fillRect(sx, sy, 2, 2);
    }
    ctx.globalAlpha = 1;
  }

  // 太阳（白天）/ 月亮（夜晚）随主题淡入淡出
  const cx = W * 0.78, cy = 90;
  if (sky.night < 0.95) {
    ctx.globalAlpha = 1 - sky.night;
    ctx.fillStyle = "rgba(255,236,150,.9)";
    ctx.beginPath(); ctx.arc(cx, cy, 34, 0, 7); ctx.fill();
    ctx.fillStyle = "rgba(255,246,200,.35)";
    ctx.beginPath(); ctx.arc(cx, cy, 48, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  }
  if (sky.night > 0.05) {
    ctx.globalAlpha = sky.night;
    ctx.fillStyle = "rgba(240,240,225,.92)";
    ctx.beginPath(); ctx.arc(cx, cy, 28, 0, 7); ctx.fill();
    ctx.fillStyle = sky.top;
    ctx.beginPath(); ctx.arc(cx - 12, cy - 8, 24, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // 池塘装饰：远处荷叶 + 芦苇（随主题淡入）
  if (sky.pond > 0.04) {
    ctx.globalAlpha = sky.pond;
    for (let i = 0; i < 6; i++) {
      const lx = (((i * 167 + 90) - dist * 0.3) % (W + 120) + (W + 120)) % (W + 120) - 60;
      ctx.fillStyle = i % 2 ? "#3f8f5e" : "#4da56c";
      ctx.beginPath(); ctx.ellipse(lx, GROUND - 8, 24, 7, 0, 0, 7); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.25)";
      ctx.beginPath(); ctx.ellipse(lx, GROUND - 10, 15, 3.6, 0, 0, 7); ctx.fill();
      if (i % 3 === 0) { // 小荷花
        ctx.fillStyle = "#f2a0b5";
        ctx.beginPath(); ctx.arc(lx + 4, GROUND - 16, 4.5, 0, 7); ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.beginPath(); ctx.arc(lx + 3, GROUND - 17, 2.2, 0, 7); ctx.fill();
      }
    }
    for (let i = 0; i < 9; i++) {
      const rx = (((i * 131 + 40) - dist * 0.35) % (W + 100) + (W + 100)) % (W + 100) - 50;
      const rh = 46 + (i % 4) * 12;
      ctx.strokeStyle = "#3e7d5a"; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(rx, GROUND + 4);
      ctx.quadraticCurveTo(rx + 6, GROUND - rh * 0.5, rx + 3, GROUND - rh);
      ctx.stroke();
      if (i % 2 === 0) { // 香蒲棒
        ctx.fillStyle = "#7a5230";
        ctx.beginPath(); ctx.ellipse(rx + 3, GROUND - rh - 5, 3.4, 9, 0, 0, 7); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  // 远山
  ctx.fillStyle = sky.hill;
  ctx.beginPath();
  ctx.moveTo(0, GROUND);
  for (let x = 0; x <= W; x += 24)
    ctx.lineTo(x, GROUND - 60 - Math.sin(x * 0.008 + 1.2) * 34 - Math.sin(x * 0.02) * 14);
  ctx.lineTo(W, GROUND);
  ctx.fill();

  // 云
  for (const c of clouds) {
    ctx.fillStyle = sky.night > 0.5 ? "rgba(200,205,225,.5)" : "rgba(255,255,255,.85)";
    const s = c.s;
    ctx.beginPath();
    ctx.arc(c.x, c.y, 18 * s, 0, 7);
    ctx.arc(c.x + 20 * s, c.y - 8 * s, 22 * s, 0, 7);
    ctx.arc(c.x + 44 * s, c.y, 17 * s, 0, 7);
    ctx.fill();
  }

  // 萤火虫（夜晚主题）
  if (sky.night > 0.6) {
    ctx.globalAlpha = sky.night;
    for (let i = 0; i < 9; i++) {
      const fx = ((i * 211 + elapsed * (18 + i * 4)) % (W + 60) + (W + 60)) % (W + 60) - 30;
      const fy = 150 + ((i * 73) % 200) + Math.sin(elapsed * 0.9 + i * 2.3) * 42;
      const gl = 0.45 + 0.55 * Math.max(0, Math.sin(elapsed * 2.4 + i * 1.7));
      ctx.fillStyle = `rgba(190,255,120,${0.16 * gl})`;
      ctx.beginPath(); ctx.arc(fx, fy, 9, 0, 7); ctx.fill();
      ctx.fillStyle = `rgba(220,255,150,${0.85 * gl})`;
      ctx.beginPath(); ctx.arc(fx, fy, 2.4, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

function drawGround(sky) {
  // 土
  ctx.fillStyle = sky.ground;
  ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = sky.groundDark;
  const off = dist % 48;
  for (let x = -off; x < W; x += 48) {
    ctx.beginPath();
    ctx.arc(x, GROUND + 40, 3, 0, 7); ctx.fill();
    ctx.beginPath();
    ctx.arc(x + 24, GROUND + 62, 2.4, 0, 7); ctx.fill();
  }
  // 草皮
  ctx.fillStyle = sky.grass;
  ctx.fillRect(0, GROUND - 4, W, 14);
  ctx.fillStyle = sky.grass2;
  const goff = dist % 26;
  for (let x = -goff; x < W; x += 26) {
    ctx.beginPath();
    ctx.moveTo(x, GROUND - 2);
    ctx.lineTo(x + 5, GROUND - 12 - (x % 3) * 2);
    ctx.lineTo(x + 10, GROUND - 2);
    ctx.fill();
  }
  // 下雨：地面反光
  if (weather === 1) {
    ctx.fillStyle = "rgba(200,235,255,.13)";
    ctx.fillRect(0, GROUND - 4, W, 20);
    ctx.fillStyle = "rgba(255,255,255,.10)";
    for (let x = (dist % 90); x < W; x += 90) {
      ctx.beginPath(); ctx.ellipse(x, GROUND + 16, 26, 2.6, 0, 0, 7); ctx.fill();
    }
  }
}

/* ---- 障碍绘制 ---- */
function drawObstacle(o) {
  ctx.save();
  ctx.translate(o.x, o.y);
  if (o.type === "rock" || o.type === "rock2") {
    const h = o.h, w = o.w;
    ctx.fillStyle = "#9a958c";
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(w * .12, -h * .8); ctx.lineTo(w * .5, -h);
    ctx.lineTo(w * .88, -h * .7); ctx.lineTo(w, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#b5b0a6";
    ctx.beginPath();
    ctx.moveTo(w * .5, -h); ctx.lineTo(w * .88, -h * .7); ctx.lineTo(w * .62, -h * .35); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#6fae4e"; // 顶上小草
    ctx.beginPath(); ctx.ellipse(w * .5, -h + 2, 10, 5, 0, 0, 7); ctx.fill();
  } else if (o.type === "stump") {
    ctx.fillStyle = "#7a5a3a";
    ctx.fillRect(4, -o.h, o.w - 8, o.h);
    ctx.fillStyle = "#8f6c46";
    ctx.beginPath(); ctx.ellipse(o.w / 2, -o.h, o.w / 2 - 4, 8, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = "#6b4d30"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(o.w / 2, -o.h, o.w / 2 - 12, 4.5, 0, 0, 7); ctx.stroke();
    // 蘑菇装饰
    ctx.fillStyle = "#e05b4b";
    ctx.beginPath(); ctx.arc(o.w - 14, -o.h - 2, 8, Math.PI, 0); ctx.fill();
    ctx.fillStyle = "#fff2e0";
    ctx.fillRect(o.w - 17, -o.h - 2, 6, 6);
  } else if (o.type === "bush") {
    ctx.fillStyle = "#4e8f3d";
    ctx.beginPath();
    ctx.arc(16, -14, 16, 0, 7); ctx.arc(38, -20, 19, 0, 7);
    ctx.arc(60, -14, 15, 0, 7); ctx.fill();
    ctx.fillStyle = "#d95f5f"; // 小刺果
    ctx.beginPath(); ctx.arc(20, -24, 3.4, 0, 7); ctx.arc(48, -30, 3.4, 0, 7); ctx.fill();
  } else if (o.type === "bird") {
    const fl = Math.sin(o.wingT) * 9;
    const cy0 = -o.h / 2; // 身体中心
    // 尾羽
    ctx.fillStyle = "#c97f22";
    ctx.beginPath(); ctx.moveTo(40, cy0 - 2); ctx.lineTo(55, cy0 - 10 + fl * 0.4); ctx.lineTo(53, cy0 + 6); ctx.closePath(); ctx.fill();
    // 远侧翅膀
    ctx.fillStyle = "#d88a28";
    ctx.beginPath(); ctx.ellipse(28, cy0 - 8 - fl * 0.5, 13, 6.5 + Math.abs(fl) * 0.4, -0.5 + fl * 0.05, 0, 7); ctx.fill();
    // 身体
    ctx.fillStyle = "#f0a132";
    ctx.beginPath(); ctx.ellipse(26, cy0, 19, 13, 0, 0, 7); ctx.fill();
    // 奶白肚皮
    ctx.fillStyle = "#fdeccd";
    ctx.beginPath(); ctx.ellipse(24, cy0 + 5, 11, 7, 0, 0, 7); ctx.fill();
    // 头
    ctx.fillStyle = "#f0a132";
    ctx.beginPath(); ctx.arc(8, cy0 - 6, 10, 0, 7); ctx.fill();
    // 喙
    ctx.fillStyle = "#e05b3b";
    ctx.beginPath(); ctx.moveTo(0, cy0 - 9); ctx.lineTo(-11, cy0 - 4); ctx.lineTo(0, cy0 - 1); ctx.closePath(); ctx.fill();
    // 眼睛
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(7, cy0 - 9, 3.4, 0, 7); ctx.fill();
    ctx.fillStyle = "#222";
    ctx.beginPath(); ctx.arc(5.8, cy0 - 9, 1.8, 0, 7); ctx.fill();
    // 近侧翅膀（扇动）
    ctx.fillStyle = "#e8952f";
    ctx.beginPath(); ctx.ellipse(27, cy0 - 3 - fl * 0.6, 14, 7 + Math.abs(fl) * 0.5, -0.35 + fl * 0.06, 0, 7); ctx.fill();
  } else if (o.type === "puddle") {
    // 水洼
    ctx.fillStyle = "#4f9fd6";
    ctx.beginPath(); ctx.ellipse(o.w / 2, -3, o.w / 2, o.h + 4, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#7cc4ec";
    ctx.beginPath(); ctx.ellipse(o.w / 2, -4, o.w / 2 - 7, o.h - 1, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.5)";
    ctx.beginPath(); ctx.ellipse(o.w * 0.36, -7, o.w * 0.16, 2.6, 0, 0, 7); ctx.fill();
    // 扩散波纹
    const ph = (o.rip * 0.7) % 1;
    ctx.strokeStyle = `rgba(255,255,255,${(1 - ph) * 0.5})`;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.ellipse(o.w / 2, -4, (o.w / 2 - 8) * (0.3 + ph * 0.7), (o.h - 2) * (0.3 + ph * 0.7), 0, 0, 7);
    ctx.stroke();
  } else if (o.type === "bee") {
    const wt = o.wingT;
    ctx.fillStyle = "rgba(220,235,255,.8)";
    ctx.beginPath();
    ctx.ellipse(14, -o.h + 6, 12, 5 + Math.sin(wt) * 3, -0.5, 0, 7);
    ctx.fill();
    ctx.fillStyle = "#f2c435";
    ctx.beginPath(); ctx.ellipse(20, -o.h + 14, 18, 13, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#3a3226";
    ctx.fillRect(12, -o.h + 3, 6, 22);
    ctx.fillRect(24, -o.h + 5, 6, 19);
    ctx.beginPath(); ctx.arc(38, -o.h + 12, 7, 0, 7); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(40, -o.h + 10, 2.4, 0, 7); ctx.fill();
  }
  ctx.restore();
}

/* ---- 奶蛙绘制：优先用豆包生成的精灵图，加载失败回退到手绘 ---- */
function drawFrog() {
  const canRun = sprites.run.complete && sprites.run.naturalWidth > 0;
  const canStand = sprites.stand.complete && sprites.stand.naturalWidth > 0;
  if (!canRun && !canStand) { drawFrogVector(); return; }

  const dead = state === S_OVER;
  const bob = frog.onGround && !dead ? Math.abs(Math.sin(frog.runT)) * 4.5 : 0;
  const by = frog.y - bob;                       // 脚底
  const cx = frog.x + frog.w / 2;

  ctx.save();
  // 影子（不随身体倾斜）
  const sh = Math.max(0.25, 1 - (GROUND - by) / 260);
  ctx.fillStyle = `rgba(0,0,0,${0.22 * sh})`;
  ctx.beginPath();
  ctx.ellipse(cx, GROUND + 5, frog.w * 0.40 * sh, 6 * sh, 0, 0, 7);
  ctx.fill();

  // 姿态：菜单正面站立；奔跑前倾，起跳微仰，下落前压；扑倒前翻
  const img = state === S_START && canStand ? sprites.stand : sprites.run;
  const cxr = cx, cyr = by - frog.h / 2;
  if (dead) {
    const dp = frog.deadRot / 1.5;
    ctx.translate(cxr, cyr + dp * 12);
    ctx.rotate(frog.deadRot);
    ctx.translate(-cxr, -cyr);
  } else if (state !== S_START) {
    const lean = frog.onGround ? 0.09 : (frog.vy < 0 ? -0.03 : 0.10);
    ctx.translate(cxr, cyr); ctx.rotate(lean); ctx.translate(-cxr, -cyr);
  }

  const dh = frog.h * 1.18;
  const dw = dh * (img.naturalWidth / img.naturalHeight);
  ctx.drawImage(img, cx - dw / 2, by - dh + 2, dw, dh);
  ctx.restore();
}

/* ---- 奶蛙手绘兜底（大头单眼 + 梨形大肚 + 大黑脚丫） ---- */
function drawFrogVector() {
  const dead = state === S_OVER;
  const air = !frog.onGround && !dead;
  const bob = frog.onGround && !dead ? Math.abs(Math.sin(frog.runT)) * 4.5 : 0;
  const bx = frog.x, by = frog.y - bob;         // 脚底
  const bw = frog.w, bh = frog.h;

  ctx.save();
  // 影子（不随身体倾斜）
  const sh = Math.max(0.25, 1 - (GROUND - by) / 260);
  ctx.fillStyle = `rgba(0,0,0,${0.22 * sh})`;
  ctx.beginPath();
  ctx.ellipse(bx + bw / 2, GROUND + 5, bw * 0.40 * sh, 6 * sh, 0, 0, 7);
  ctx.fill();

  if (dead) {
    // 扑倒：前翻趴地 + 身体贴地面（参照视频结尾）
    const dp = frog.deadRot / 1.5;
    ctx.translate(bx + bw / 2, by - bh / 2 + dp * 12);
    ctx.rotate(frog.deadRot);
    ctx.translate(-(bx + bw / 2), -(by - bh / 2));
  } else {
    // 参照奶蛙奔跑视频：奔跑明显前倾，起跳微仰，下落前压
    const lean = frog.onGround ? 0.09 : (frog.vy < 0 ? -0.03 : 0.10);
    ctx.translate(bx + bw / 2, by - bh / 2);
    ctx.rotate(lean);
    ctx.translate(-(bx + bw / 2), -(by - bh / 2));
  }

  // 双腿交替迈步（远侧腿在身体后面）
  let pose1, pose2;
  if (air) {
    if (frog.vy < 0) { pose1 = { x: -10, lift: 7 }; pose2 = { x: 12, lift: 5 }; }
    else { pose1 = { x: 10, lift: 4 }; pose2 = { x: -8, lift: 6 }; }
  } else {
    pose1 = runPose(frog.runT + Math.PI);
    pose2 = runPose(frog.runT);
  }
  drawLeg(bx + bw * 0.32, by - 6, pose1, "#eab108");   // 远侧腿

  // 身体：头小肚大的梨形，侧脸朝右，后颈微收
  const topY = by - bh;
  const grad = ctx.createRadialGradient(bx + bw * 0.38, topY + bh * 0.24, 4, bx + bw * 0.5, by - bh * 0.28, bh * 0.95);
  grad.addColorStop(0, "#ffe45c");
  grad.addColorStop(0.55, "#ffd41f");
  grad.addColorStop(1, "#f2a413");
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(bx + bw * 0.50, topY);                                          // 头顶
  ctx.bezierCurveTo(bx + bw * 0.74, topY, bx + bw * 0.88, topY + bh * 0.07, bx + bw * 0.86, topY + bh * 0.17);   // 额头→脸
  ctx.bezierCurveTo(bx + bw * 0.84, topY + bh * 0.26, bx + bw * 0.76, topY + bh * 0.31, bx + bw * 0.73, topY + bh * 0.35); // 下巴脖颈微收
  ctx.bezierCurveTo(bx + bw * 0.95, topY + bh * 0.44, bx + bw * 1.03, topY + bh * 0.60, bx + bw * 0.99, topY + bh * 0.74); // 胸腹鼓出
  ctx.bezierCurveTo(bx + bw * 0.95, by - bh * 0.08, bx + bw * 0.78, by + 2, bx + bw * 0.52, by + 2);   // 底部圆弧
  ctx.bezierCurveTo(bx + bw * 0.26, by + 2, bx + bw * 0.04, by - bh * 0.06, bx + bw * 0.045, topY + bh * 0.72); // 臀后
  ctx.bezierCurveTo(bx + bw * 0.05, topY + bh * 0.56, bx + bw * 0.13, topY + bh * 0.44, bx + bw * 0.25, topY + bh * 0.37); // 背部上行
  ctx.bezierCurveTo(bx + bw * 0.17, topY + bh * 0.30, bx + bw * 0.19, topY + bh * 0.18, bx + bw * 0.21, topY + bh * 0.13); // 后颈收窄
  ctx.bezierCurveTo(bx + bw * 0.24, topY + bh * 0.04, bx + bw * 0.34, topY, bx + bw * 0.50, topY);   // 后脑→头顶
  ctx.fill();

  // 下身暖橙阴影
  ctx.fillStyle = "rgba(242,150,32,.35)";
  ctx.beginPath();
  ctx.ellipse(bx + bw * 0.36, by - bh * 0.10, bw * 0.30, bh * 0.09, 0, 0, 7);
  ctx.fill();

  // 奶白肚皮（下前方）
  ctx.fillStyle = "#f8f1de";
  ctx.beginPath();
  ctx.ellipse(bx + bw * 0.55, by - bh * 0.30, bw * 0.34, bh * 0.26, -0.08, 0, 7);
  ctx.fill();

  // 头顶高光
  ctx.fillStyle = "rgba(255,255,255,.35)";
  ctx.beginPath();
  ctx.ellipse(bx + bw * 0.40, topY + bh * 0.08, bw * 0.15, bh * 0.04, -0.3, 0, 7);
  ctx.fill();

  // 近侧腿画在肚皮前面：抬脚时能看到膝盖顶起来
  drawLeg(bx + bw * 0.68, by - 6, pose2, "#f7bd18");

  // 手臂（前后大幅交替摆臂 / 起跳与扑倒时双手前伸）
  const rising = (air && frog.vy < 0) || dead;
  ctx.lineCap = "round";
  drawArm(bx + bw * 0.17, topY + bh * 0.40, rising, Math.sin(frog.runT + Math.PI), "#eab108");
  drawArm(bx + bw * 0.85, topY + bh * 0.38, rising, Math.sin(frog.runT), "#f7bd18");

  // 侧脸单眼（绿色圆眼 + 黑瞳，眉部微凸）
  const ex = bx + bw * 0.68, ey = topY + bh * 0.145;
  ctx.fillStyle = "rgba(255,255,255,.16)";
  ctx.beginPath(); ctx.arc(ex, ey - 2, 9, 0, 7); ctx.fill();
  if (dead) {
    ctx.fillStyle = "#5ca83c";
    ctx.beginPath(); ctx.arc(ex, ey, 6.5, 0, 7); ctx.fill();
    ctx.strokeStyle = "#3f3416"; ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(ex - 4, ey - 4); ctx.lineTo(ex + 4, ey + 4);
    ctx.moveTo(ex + 4, ey - 4); ctx.lineTo(ex - 4, ey + 4);
    ctx.stroke();
  } else if (frog.blink > 0) {
    ctx.strokeStyle = "#3f3416"; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.moveTo(ex - 5, ey); ctx.lineTo(ex + 5, ey); ctx.stroke();
  } else {
    ctx.fillStyle = "#5ca83c";
    ctx.beginPath(); ctx.arc(ex, ey, 6.5, 0, 7); ctx.fill();
    ctx.fillStyle = "#20240f";
    ctx.beginPath(); ctx.arc(ex + 1, ey, 3.6, 0, 7); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(ex + 2, ey - 1.6, 1.5, 0, 7); ctx.fill();
  }

  // 嘴角浅笑
  ctx.strokeStyle = "rgba(90,70,20,.5)"; ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(bx + bw * 0.755, topY + bh * 0.245);
  ctx.quadraticCurveTo(bx + bw * 0.79, topY + bh * 0.252, bx + bw * 0.795, topY + bh * 0.232);
  ctx.stroke();

  ctx.restore();
}

// 奔跑步态：前摆时抬脚，后蹬时贴地
function runPose(p) {
  const s = Math.sin(p);
  return { x: s * 16, lift: Math.max(0, s) * 10 };
}

function drawLeg(x, y, pose, color) {
  const footX = x + pose.x;
  const footY = y + 5 - pose.lift;
  ctx.strokeStyle = color;
  ctx.lineWidth = 12;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.quadraticCurveTo(x + pose.x * 0.4, y + 2, footX, footY);
  ctx.stroke();
  // 大黑脚丫（扁平脚掌）
  ctx.fillStyle = "#3f382b";
  ctx.beginPath();
  ctx.ellipse(footX + 5, footY + 4, 13, 6, 0, 0, 7);
  ctx.fill();
}

function drawArm(x, y, up, swing, color) {
  let hx, hy;
  if (up) { hx = x + 4; hy = y - 16; }
  else { hx = x + 4 + swing * 14; hy = y + 15 - Math.max(0, swing) * 5; }
  ctx.strokeStyle = color;
  ctx.lineWidth = 11;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.quadraticCurveTo(x + swing * 5, y + 6, hx, hy);
  ctx.stroke();
  // 圆润小手（黄色）
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(hx, hy, 5.5, 0, 7);
  ctx.fill();
}

function drawCoins() {
  for (const c of coins) {
    const y = c.y + Math.sin(c.t * 4) * 5;
    const spin = 0.25 + Math.abs(Math.cos(c.t * 2.6)) * 0.75;  // 绕轴翻转效果
    const r = c.r * (c.gold ? 1.35 : 1);
    ctx.save();
    ctx.translate(c.x, y);
    ctx.scale(spin, 1);
    ctx.fillStyle = c.gold ? "#d97706" : "#e0a10a";
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
    ctx.fillStyle = c.gold ? "#fbbf24" : "#fbc02d";
    ctx.beginPath(); ctx.arc(0, 0, r * 0.76, 0, 7); ctx.fill();
    ctx.fillStyle = c.gold ? "#b45309" : "#d18f00";
    drawStar(0, 0, r * 0.5, 5);
    ctx.restore();
  }
}

function drawStar(x, y, r, n) {
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const rr = i % 2 === 0 ? r : r * 0.45;
    const a = -Math.PI / 2 + (i * Math.PI) / n;
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath();
  ctx.fill();
}

/* ---- 道具绘制：护盾 / 磁铁 ---- */
function drawItems() {
  for (const it of items) {
    const y = it.y + Math.sin(it.t * 3) * 6;
    ctx.fillStyle = it.kind === "shield" ? "rgba(120,200,255,.20)" : "rgba(255,130,130,.20)";
    ctx.beginPath(); ctx.arc(it.x, y, 25, 0, 7); ctx.fill();
    if (it.kind === "shield") {
      ctx.fillStyle = "rgba(140,205,255,.6)";
      ctx.beginPath(); ctx.arc(it.x, y, 16, 0, 7); ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,.9)"; ctx.lineWidth = 2.4; ctx.stroke();
      // 盾牌
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.moveTo(it.x, y - 8);
      ctx.lineTo(it.x + 7, y - 4.5);
      ctx.lineTo(it.x + 7, y + 2);
      ctx.quadraticCurveTo(it.x + 7, y + 7.5, it.x, y + 9);
      ctx.quadraticCurveTo(it.x - 7, y + 7.5, it.x - 7, y + 2);
      ctx.lineTo(it.x - 7, y - 4.5);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#4a9fe0";
      ctx.fillRect(it.x - 1.4, y - 3, 2.8, 6);
      ctx.fillRect(it.x - 3.5, y - 0.5, 7, 2.4);
    } else {
      // U形磁铁
      ctx.strokeStyle = "#e05555"; ctx.lineWidth = 7.5; ctx.lineCap = "butt";
      ctx.beginPath(); ctx.arc(it.x, y - 2, 9.5, Math.PI, 0); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(it.x - 9.5, y - 2); ctx.lineTo(it.x - 9.5, y + 7);
      ctx.moveTo(it.x + 9.5, y - 2); ctx.lineTo(it.x + 9.5, y + 7);
      ctx.stroke();
      ctx.fillStyle = "#f5f5f5";
      ctx.fillRect(it.x - 13.2, y + 6, 7.4, 4.6);
      ctx.fillRect(it.x + 5.8, y + 6, 7.4, 4.6);
    }
  }
}

/* ---- 增益特效：护盾泡泡 / 磁铁力场 ---- */
function drawBuffs() {
  if (state !== S_PLAY) return;
  const cx = frog.x + frog.w / 2, cy = frog.y - frog.h / 2 - 4;
  if (shieldT > 0) {
    const rr = frog.w * 0.82 + Math.sin(elapsed * 6) * 2.5;
    ctx.fillStyle = `rgba(150,215,255,${0.13 + Math.sin(elapsed * 5) * 0.04})`;
    ctx.beginPath(); ctx.arc(cx, cy, rr, 0, 7); ctx.fill();
    ctx.strokeStyle = `rgba(140,210,255,${0.55 + Math.sin(elapsed * 8) * 0.18})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, rr, 0, 7); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,.55)";
    ctx.beginPath(); ctx.ellipse(cx - rr * 0.36, cy - rr * 0.44, rr * 0.17, rr * 0.085, -0.6, 0, 7); ctx.fill();
  }
  if (magnetT > 0) {
    ctx.save();
    ctx.strokeStyle = `rgba(255,140,140,${0.32 + Math.sin(elapsed * 6) * 0.1})`;
    ctx.lineWidth = 2;
    ctx.setLineDash([9, 11]);
    ctx.lineDashOffset = -elapsed * 60;
    ctx.beginPath(); ctx.arc(cx, cy, 96, 0, 7); ctx.stroke();
    ctx.restore();
  }
}

/* ---- 天气绘制：雨滴 / 落叶 ---- */
function drawWeather() {
  for (const d of drops) {
    if (d.leaf) {
      ctx.save();
      ctx.translate(d.x, d.y);
      ctx.rotate(d.rot);
      ctx.fillStyle = "rgba(210,150,60,.85)";
      ctx.beginPath();
      ctx.ellipse(0, 0, 7 * d.s, 3.6 * d.s, 0, 0, 7);
      ctx.fill();
      ctx.strokeStyle = "rgba(150,100,40,.8)";
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-7 * d.s, 0); ctx.lineTo(7 * d.s, 0); ctx.stroke();
      ctx.restore();
    } else {
      ctx.strokeStyle = "rgba(190,225,250,.65)";
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - d.vx * 0.016, d.y - d.len);
      ctx.stroke();
    }
  }
}

function drawParticles() {
  for (const p of parts) {
    ctx.globalAlpha = 1 - p.t / p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = "center";
  for (const p of popups) {
    ctx.globalAlpha = 1 - p.t / 0.9;
    ctx.font = "bold 20px 'Microsoft YaHei', sans-serif";
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
}

/* ---- UI 界面 ---- */
function drawUI() {
  ctx.textAlign = "left";
  ctx.font = "bold 26px 'Microsoft YaHei', sans-serif";
  ctx.fillStyle = "rgba(0,0,0,.35)";
  ctx.fillText("分数 " + score(), 26, 44);
  ctx.fillStyle = "#fff";
  ctx.fillText("分数 " + score(), 24, 42);

  ctx.font = "16px 'Microsoft YaHei', sans-serif";
  ctx.fillStyle = "rgba(255,255,255,.85)";
  ctx.fillText("最高 " + best, 26, 68);

  // 金币计数
  ctx.fillStyle = "#e0a10a";
  ctx.beginPath(); ctx.arc(34, 90, 9, 0, 7); ctx.fill();
  ctx.fillStyle = "#fbc02d";
  ctx.beginPath(); ctx.arc(34, 90, 6.5, 0, 7); ctx.fill();
  ctx.font = "16px 'Microsoft YaHei', sans-serif";
  ctx.fillStyle = "rgba(255,255,255,.9)";
  ctx.fillText("金币 " + coinsGot, 48, 96);

  // 连击指示
  let uy = 124;
  if (combo >= 2 && comboT > 0 && state === S_PLAY) {
    ctx.font = "bold 21px 'Microsoft YaHei', sans-serif";
    ctx.strokeStyle = "rgba(0,0,0,.4)"; ctx.lineWidth = 4;
    const txt = "连击 x" + combo + (combo >= 5 ? "  分数翻倍" : "");
    ctx.strokeText(txt, 26, uy);
    ctx.fillStyle = combo >= 5 ? "#ff9d2e" : "#ffe37a";
    ctx.fillText(txt, 26, uy);
    ctx.fillStyle = "rgba(0,0,0,.25)";
    ctx.fillRect(26, uy + 8, 74, 5);
    ctx.fillStyle = combo >= 5 ? "#ff9d2e" : "#ffd34d";
    ctx.fillRect(26, uy + 8, 74 * Math.min(1, comboT / 2), 5);
    uy += 36;
  }

  // 增益状态与天气
  if (state === S_PLAY) {
    ctx.font = "15px 'Microsoft YaHei', sans-serif";
    if (shieldT > 0) {
      ctx.fillStyle = "rgba(120,200,255,.9)";
      ctx.beginPath(); ctx.arc(33, uy + 2, 8, 0, 7); ctx.fill();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.6; ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.92)";
      ctx.fillText("护盾 " + Math.max(0, shieldT).toFixed(1) + "s", 48, uy + 7);
      uy += 24;
    }
    if (magnetT > 0) {
      ctx.fillStyle = "rgba(255,120,120,.9)";
      ctx.beginPath(); ctx.arc(33, uy + 2, 8, 0, 7); ctx.fill();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.6; ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.92)";
      ctx.fillText("磁铁 " + Math.max(0, magnetT).toFixed(1) + "s", 48, uy + 7);
      uy += 24;
    }
    ctx.fillStyle = "rgba(255,255,255,.75)";
    ctx.fillText("天气：" + ["晴", "雨", "风"][weather], 26, uy + 6);
  }

  if (state === S_PLAY && paused) {
    overlay("已暂停", "按 P 继续", "");
  }
}

function overlay(title, line1, line2) {
  ctx.fillStyle = "rgba(20,30,25,.55)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.fillStyle = "#fff";
  ctx.font = "bold 54px 'Microsoft YaHei', sans-serif";
  ctx.fillText(title, W / 2, H / 2 - 60);
  ctx.font = "22px 'Microsoft YaHei', sans-serif";
  ctx.fillStyle = "rgba(255,255,255,.92)";
  ctx.fillText(line1, W / 2, H / 2 + 2);
  if (line2) ctx.fillText(line2, W / 2, H / 2 + 40);
}

function drawStart() {
  overlay("奶蛙快跑", "跳跃：空格 / ↑ / 点击屏幕（可二段跳）    P 暂停", "吃金币攒连击 · 护盾抵挡撞击 · 磁铁吸金币 —— 按任意跳跃键开始");
  // 标题旁的大奶蛙
  ctx.save();
  ctx.translate(W / 2, 448);
  ctx.scale(1.2, 1.2);
  const saveFrog = { ...frog, x: -32, y: 24, onGround: true };
  drawFrogAt(saveFrog);
  ctx.restore();
}

function drawOver() {
  overlay("游戏结束", "本局分数 " + score() + "    最高分 " + best,
    score() >= best && score() > 0 ? "新纪录！" : "按空格或点击重新开始");
}

// 在指定位置绘制奶蛙（开始界面用），复用主体绘制逻辑
function drawFrogAt(f) {
  const old = { x: frog.x, y: frog.y, onGround: frog.onGround, runT: frog.runT, blink: frog.blink, deadRot: frog.deadRot };
  Object.assign(frog, f);
  drawFrog();
  Object.assign(frog, old);
}

/* ================= 主循环 ================= */
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;

  update(dt);

  // 震屏
  ctx.save();
  if (shakeT > 0) {
    ctx.translate(rand(-6, 6) * shakeT / 0.35, rand(-6, 6) * shakeT / 0.35);
  }

  const sky = skyState();
  drawBackground(sky);
  drawGround(sky);
  for (const o of obstacles) drawObstacle(o);
  drawCoins();
  drawItems();
  drawFrog();
  drawBuffs();
  drawWeather();
  drawParticles();
  ctx.restore();

  drawUI();
  if (state === S_START) drawStart();
  if (state === S_OVER) drawOver();

  requestAnimationFrame(loop);
}

/* 开始界面待机动画：让标题蛙腿动起来 */
setInterval(() => { if (state !== S_PLAY) frog.runT += 0.18; }, 40);

requestAnimationFrame(loop);
})();
</script>
